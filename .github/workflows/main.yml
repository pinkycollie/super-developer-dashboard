# .github/workflows/vercel-deploy.yml
name: Deploy to Vercel with Env Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch ENV from EnvHub 360
        run: |
          curl "https://envhub.360magicians.com/api/envhub?project=mbtq.dev&stage=prod" > env.json
          jq -r '.[] | "\(.key)=\(.value)"' env.json > .env
          cat .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build and Export (if static)
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/dev-platform-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
