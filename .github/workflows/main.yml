name: Deploy to Vercel with Env Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      envhub_domain:
        description: 'Custom EnvHub Domain (e.g., envhub.360magicians.com)'
        required: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    env:
      ENVHUB_DOMAIN: ${{ github.event.inputs.envhub_domain }}
      PROJECT_NAME: mbtq.dev
      STAGE: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Fetch ENV from EnvHub
        run: |
          echo "🔍 Fetching from $ENVHUB_DOMAIN"
          curl -s -o env.json "https://$ENVHUB_DOMAIN/api/envhub?project=$PROJECT_NAME&stage=$STAGE"
          cat env.json

          if jq -e . env.json >/dev/null 2>&1; then
            jq -r '.[] | "\(.key)=\(.value)"' env.json > .env
          else
            echo "❌ Invalid JSON received from $ENVHUB_DOMAIN"
            exit 1
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/dev-platform-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}